<title>Carousel — baggage claim, but a puzzle</title>
<style>
  /* Deliberate single visual world: an arrivals hall at 2am.
     Steel, rubber, and amber signage — no light theme by design. */
  :root {
    --ink:      #090D12;
    --ink-2:    #0F151C;
    --steel:    #1A2029;
    --steel-hi: #2B3541;
    --bone:     #E8E4DA;
    --dim:      #79838F;
    --amber:    #FFB23F;
    --mint:     #5FD6A8;
    --red:      #FF6B5E;
    --sign: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --data: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--bone);
    font-family: var(--sign);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  body {
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .frame {
    position: relative;
    display: flex;
    flex-direction: column;
    /* Bounded on both ends: some hosts size their frame from content height,
       and an unbounded viewport unit feeds back into that and runs away. */
    height: 100dvh;
    min-height: 540px;
    max-height: 940px;
    max-width: 520px;
    margin: 0 auto;
    background: var(--ink);
  }

  /* ── signage strip ─────────────────────────────────────────── */
  .hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 11px 16px 10px;
    border-bottom: 1px solid #1D242D;
    background: linear-gradient(180deg, #12181F, #0C1116);
  }

  .stat { display: flex; flex-direction: column; gap: 3px; }
  .stat--mid { align-items: center; }
  .stat--end { align-items: flex-end; }

  .label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .value {
    font-family: var(--data);
    font-variant-numeric: tabular-nums;
    font-size: 19px;
    line-height: 1;
    color: var(--bone);
  }
  .value--score { font-size: 22px; }

  .combo {
    font-family: var(--data);
    font-size: 19px;
    line-height: 1;
    color: var(--steel-hi);
    transition: color .18s ease, transform .18s ease;
  }
  .combo.is-hot { color: var(--amber); transform: scale(1.14); }

  /* ── play field ────────────────────────────────────────────── */
  canvas {
    flex: 1 1 auto;
    display: block;
    width: 100%;
    min-height: 0;
  }

  /* ── dock ──────────────────────────────────────────────────── */
  .dock {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid #1D242D;
    background: #0C1116;
  }

  button {
    font-family: var(--sign);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bone);
    background: var(--steel);
    border: 1px solid var(--steel-hi);
    border-radius: 3px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background .14s ease, opacity .14s ease;
  }
  button:hover { background: var(--steel-hi); }
  button:active { background: #35404E; }
  button:disabled { opacity: .3; cursor: default; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .btn--return { flex: 1 1 auto; }
  .btn--return b {
    font-family: var(--data);
    font-weight: 400;
    color: var(--amber);
    margin-left: 7px;
  }
  .btn--icon { padding: 12px 14px; font-size: 13px; letter-spacing: 0; }

  /* ── overlay ───────────────────────────────────────────────── */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
    background: rgba(6, 9, 13, .9);
    backdrop-filter: blur(3px);
    z-index: 2;
  }
  .overlay[hidden] { display: none; }

  .eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 10px;
  }

  h1 {
    font-size: clamp(40px, 14vw, 66px);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: .92;
    margin: 0;
    text-wrap: balance;
  }

  .blurb {
    max-width: 30ch;
    margin: 16px 0 0;
    font-size: 14px;
    line-height: 1.55;
    color: var(--dim);
  }
  .blurb em { color: var(--bone); font-style: normal; }

  .readout {
    display: flex;
    gap: 28px;
    margin: 22px 0 0;
    font-family: var(--data);
    font-variant-numeric: tabular-nums;
  }
  .readout div { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .readout span { font-size: 25px; color: var(--bone); }
  .readout small {
    font-family: var(--sign);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .go {
    margin-top: 26px;
    padding: 15px 34px;
    font-size: 13px;
    background: var(--amber);
    border-color: var(--amber);
    color: #16120A;
  }
  .go:hover { background: #FFC66E; border-color: #FFC66E; }
  .go:active { background: #E89C2C; }

  @media (prefers-reduced-motion: reduce) {
    .combo { transition: none; }
  }
</style>

<div class="frame">
  <header class="hud">
    <div class="stat">
      <div class="label">Belt</div>
      <div class="value" id="hudLevel">01</div>
    </div>
    <div class="stat stat--mid">
      <div class="label">Flow</div>
      <div class="combo" id="hudCombo">&times;1</div>
    </div>
    <div class="stat stat--end">
      <div class="label">Score</div>
      <div class="value value--score" id="hudScore">0</div>
    </div>
  </header>

  <canvas id="stage"></canvas>

  <footer class="dock">
    <button class="btn--return" id="btnReturn">Return bag <b id="returnCount">3</b></button>
    <button class="btn--icon" id="btnSound" aria-label="Mute sound">&#9835;</button>
  </footer>

  <div class="overlay" id="overlay">
    <div class="eyebrow" id="ovEyebrow">Arrivals</div>
    <h1 id="ovTitle">CAROUSEL</h1>
    <p class="blurb" id="ovBlurb">Your claim tray holds <em>seven</em>.<br>Tap three matching bags to send a traveler home.<br>Anything you skip comes back around.</p>
    <div class="readout" id="ovStats" hidden>
      <div><span id="ovScore">0</span><small>Score</small></div>
      <div><span id="ovBest">&times;1</span><small>Best flow</small></div>
    </div>
    <button class="go" id="btnGo">Start</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ── tuning ──────────────────────────────────────────────────
  const CAP          = 7;    // tray slots
  const COMBO_WINDOW = 4.0;  // seconds to hold the flow multiplier
  const RETURNS      = 3;    // per level
  const FLY_TIME     = 0.28;
  const MULTS        = [1, 1, 2, 3, 5];

  // Every bag is identified by hue AND motif, so the game stays readable
  // for colorblind players and never depends on emoji fonts.
  const TYPES = [
    { c: "#E0674F", m: "bandH",  size: 1 },
    { c: "#4E9BD4", m: "bandV",  size: 1 },
    { c: "#C8A33C", m: "dots",   size: 1 },
    { c: "#9E6BC9", m: "ring",   size: 1 },
    { c: "#7FA05A", m: "cross",  size: 1 },
    { c: "#DE6B95", m: "chev",   size: 1 },
    { c: "#54B3A6", m: "grid",   size: 1 },
    { c: "#D98A3E", m: "diag",   size: 2 },
    { c: "#6E7FD1", m: "bandV",  size: 2 },
    { c: "#3FA9C4", m: "dots",   size: 2 },
  ];
  const SMALL = TYPES.map((t, i) => i).filter(i => TYPES[i].size === 1);
  const BIG   = TYPES.map((t, i) => i).filter(i => TYPES[i].size === 2);

  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ── elements ────────────────────────────────────────────────
  const cv        = document.getElementById("stage");
  const ctx       = cv.getContext("2d");
  const hudLevel  = document.getElementById("hudLevel");
  const hudScore  = document.getElementById("hudScore");
  const hudCombo  = document.getElementById("hudCombo");
  const btnReturn = document.getElementById("btnReturn");
  const btnSound  = document.getElementById("btnSound");
  const returnCt  = document.getElementById("returnCount");
  const overlay   = document.getElementById("overlay");
  const ovEyebrow = document.getElementById("ovEyebrow");
  const ovTitle   = document.getElementById("ovTitle");
  const ovBlurb   = document.getElementById("ovBlurb");
  const ovStats   = document.getElementById("ovStats");
  const ovScore   = document.getElementById("ovScore");
  const ovBest    = document.getElementById("ovBest");
  const btnGo     = document.getElementById("btnGo");

  // ── state ───────────────────────────────────────────────────
  const S = {
    phase: "intro",      // intro | playing | won | lost
    level: 1,
    score: 0,
    levelStartScore: 0,
    combo: 0,
    bestCombo: 1,
    comboTimer: 0,
    returns: RETURNS,
    bags: [],            // { type, s }  s = arclength along the belt
    tray: [],            // { type, fly:{x,y,t}|null }
    particles: [],
    speed: 70,
    tile: 44,
    baseTile: 44,
    levelCount: 14,
    shake: 0,
    beltPhase: 0,
  };

  // ── geometry ────────────────────────────────────────────────
  let W = 0, H = 0, DPR = 1;
  let track = null;
  let wall = 0;   // canvas y below which bags are visible and tappable
  let trayBox = { x: 0, y: 0, w: 0, h: 0, slotW: 0, gap: 6 };

  function layout() {
    S.baseTile = Math.max(32, Math.min(48, W * 0.112));
    const trayH = Math.min(102, Math.max(76, H * 0.15));

    trayBox.gap   = 6;
    trayBox.x     = 14;
    trayBox.w     = W - 28;
    trayBox.h     = trayH - 26;
    trayBox.y     = H - trayH + 10;
    trayBox.slotW = (trayBox.w - trayBox.gap * (CAP - 1)) / CAP;

    // Two passes: the loop needs to stay open enough that bags on opposite
    // runs never overlap, so a short viewport shrinks the bags instead.
    let rect;
    for (let pass = 0; pass < 2; pass++) {
      const pad = S.baseTile * 0.78 + 10;
      rect = {
        x: pad,
        y: pad,
        w: Math.max(80, W - pad * 2),
        h: Math.max(80, (H - trayH - 16) - pad * 2),
      };
      const need = S.baseTile * 1.34 * 2.5;
      const tight = Math.min(rect.w, rect.h);
      if (tight >= need) break;
      S.baseTile = Math.max(18, (tight / 2.5) / 1.34);
    }
    rect.r = Math.min(rect.w, rect.h) * 0.36;
    track = buildTrack(rect);

    // The baggage hall wall hides the top of the loop: bags vanish into it
    // and come back out, so what's coming next is a memory problem.
    wall = rect.y + rect.r * 0.42;
    sizeTiles();
  }

  function sizeTiles() {
    const n = Math.max(1, S.levelCount);
    S.tile = Math.max(26, Math.min(S.baseTile, track.total / n - 5));
  }

  // Rounded rectangle as a parametric loop: 4 straights + 4 quarter arcs.
  function buildTrack(rect) {
    const { x, y, w, h, r } = rect;
    const sw = w - 2 * r, sh = h - 2 * r, arc = (Math.PI / 2) * r;
    const segs = [
      { t: "l", len: sw,  x0: x + r,     y0: y,         x1: x + w - r, y1: y },
      { t: "a", len: arc, cx: x + w - r, cy: y + r,     a0: -Math.PI / 2, a1: 0 },
      { t: "l", len: sh,  x0: x + w,     y0: y + r,     x1: x + w,     y1: y + h - r },
      { t: "a", len: arc, cx: x + w - r, cy: y + h - r, a0: 0, a1: Math.PI / 2 },
      { t: "l", len: sw,  x0: x + w - r, y0: y + h,     x1: x + r,     y1: y + h },
      { t: "a", len: arc, cx: x + r,     cy: y + h - r, a0: Math.PI / 2, a1: Math.PI },
      { t: "l", len: sh,  x0: x,         y0: y + h - r, x1: x,         y1: y + r },
      { t: "a", len: arc, cx: x + r,     cy: y + r,     a0: Math.PI, a1: Math.PI * 1.5 },
    ];
    let total = 0;
    for (const s of segs) { s.start = total; total += s.len; }
    return { rect, segs, total };
  }

  function pointAt(s) {
    const L = track.total;
    s = ((s % L) + L) % L;
    for (const g of track.segs) {
      if (s <= g.start + g.len) {
        const k = (s - g.start) / g.len;
        if (g.t === "l") {
          return { x: g.x0 + (g.x1 - g.x0) * k, y: g.y0 + (g.y1 - g.y0) * k };
        }
        const a = g.a0 + (g.a1 - g.a0) * k;
        return { x: g.cx + Math.cos(a) * track.rect.r, y: g.cy + Math.sin(a) * track.rect.r };
      }
    }
    return { x: 0, y: 0 };
  }

  // ── level generation ────────────────────────────────────────
  function startLevel(n) {
    const typeCount = Math.min(SMALL.length, 2 + Math.ceil(n / 1.4));
    const pool = SMALL.slice(0, typeCount);
    if (n >= 4) pool.push(...BIG.slice(0, Math.min(BIG.length, Math.floor((n - 1) / 3))));

    const triples = Math.min(11, 4 + n);
    S.speed = Math.min(155, 68 + n * 7);

    const types = [];
    for (let i = 0; i < triples; i++) {
      const t = pool[(Math.random() * pool.length) | 0];
      types.push(t, t, t);
    }
    for (let i = types.length - 1; i > 0; i--) {          // spread matching sets
      const j = (Math.random() * (i + 1)) | 0;
      [types[i], types[j]] = [types[j], types[i]];
    }

    const gap = track.total / types.length;
    S.bags = types.map((type, i) => ({
      type,
      s: i * gap + (Math.random() - 0.5) * gap * 0.25,
    }));

    S.tray = [];
    S.particles = [];
    S.returns = RETURNS;
    S.combo = 0;
    S.comboTimer = 0;
    S.level = n;
    S.levelStartScore = S.score;
    S.levelCount = S.bags.length;
    S.phase = "playing";
    sizeTiles();
    syncHud();
  }

  // ── tray ────────────────────────────────────────────────────
  const unitsUsed = () => S.tray.reduce((a, it) => a + TYPES[it.type].size, 0);
  const anyFlying = () => S.tray.some(it => it.fly);

  function slotCenter(index) {
    let u = 0;
    for (let i = 0; i < index; i++) u += TYPES[S.tray[i].type].size;
    const size = TYPES[S.tray[index].type].size;
    const span = size * trayBox.slotW + (size - 1) * trayBox.gap;
    return {
      x: trayBox.x + u * (trayBox.slotW + trayBox.gap) + span / 2,
      y: trayBox.y + trayBox.h / 2,
    };
  }

  function claim(bagIndex) {
    const bag = S.bags[bagIndex];
    const size = TYPES[bag.type].size;
    if (unitsUsed() + size > CAP) { S.shake = REDUCED ? 0 : 5; beep("no"); return; }

    const p = pointAt(bag.s);
    S.bags.splice(bagIndex, 1);

    let at = S.tray.length;                    // group with its own kind
    for (let i = S.tray.length - 1; i >= 0; i--) {
      if (S.tray[i].type === bag.type) { at = i + 1; break; }
    }
    S.tray.splice(at, 0, { type: bag.type, fly: { x: p.x, y: p.y, t: 0 } });
    beep("pick");
  }

  function resolve() {
    const counts = new Map();
    for (const it of S.tray) counts.set(it.type, (counts.get(it.type) || 0) + 1);

    for (const [type, n] of counts) {
      if (n < 3) continue;
      let left = 3;
      for (let i = 0; i < S.tray.length && left > 0; i++) {
        if (S.tray[i].type === type) {
          burst(slotCenter(i), TYPES[type].c);
          S.tray.splice(i, 1);
          i--; left--;
        }
      }
      S.combo = Math.min(S.combo + 1, MULTS.length - 1);
      S.comboTimer = COMBO_WINDOW;
      const mult = MULTS[S.combo];
      S.score += 100 * mult * TYPES[type].size;
      S.bestCombo = Math.max(S.bestCombo, mult);
      if (!REDUCED) S.shake = 3;
      beep("pop", S.combo);
      syncHud();
    }
  }

  function checkEnd() {
    if (anyFlying() || S.phase !== "playing") return;

    if (!S.bags.length && !S.tray.length) { S.phase = "won"; showOverlay("won"); return; }

    const used = unitsUsed();
    if (used >= CAP) { S.phase = "lost"; showOverlay("lost"); return; }

    if (S.bags.length) {
      const smallest = Math.min(...S.bags.map(b => TYPES[b.type].size));
      if (used + smallest > CAP) { S.phase = "lost"; showOverlay("lost"); }
    } else {
      S.phase = "lost"; showOverlay("lost");   // belt empty, tray can never clear
    }
  }

  function returnBag() {
    if (S.phase !== "playing" || S.returns <= 0 || !S.tray.length || anyFlying()) return;
    const it = S.tray.pop();
    S.bags.push({ type: it.type, s: (S.beltPhase + track.total * 0.5) % track.total });
    S.returns--;
    S.combo = 0;
    syncHud();
    beep("return");
  }

  // ── particles ───────────────────────────────────────────────
  function burst(p, color) {
    if (REDUCED) return;
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 60 + Math.random() * 150;
      S.particles.push({
        x: p.x, y: p.y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 70,
        life: 0.5 + Math.random() * 0.3, age: 0, color,
      });
    }
  }

  // ── audio ───────────────────────────────────────────────────
  let ac = null, muted = false;
  function beep(kind, n = 0) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const t = ac.currentTime;
      const notes = kind === "pop"    ? [523.25 + n * 62, 784 + n * 62]
                  : kind === "pick"   ? [330]
                  : kind === "return" ? [262]
                  : [110];
      notes.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = kind === "no" ? "square" : "triangle";
        o.frequency.value = f;
        const t0 = t + i * 0.06;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(kind === "pop" ? 0.16 : 0.07, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
        o.connect(g); g.connect(ac.destination);
        o.start(t0); o.stop(t0 + 0.24);
      });
    } catch (e) { /* audio is a nicety, never a blocker */ }
  }

  // ── input ───────────────────────────────────────────────────
  function tap(clientX, clientY) {
    if (S.phase !== "playing") return;
    const r = cv.getBoundingClientRect();
    const x = clientX - r.left, y = clientY - r.top;
    if (y < wall) return;                       // inside the baggage hall

    let best = -1, bestD = Infinity;
    for (let i = 0; i < S.bags.length; i++) {
      const p = pointAt(S.bags[i].s);
      if (p.y < wall) continue;
      const size = TYPES[S.bags[i].type].size;
      const reach = S.tile * (size === 2 ? 0.85 : 0.62) + 10;
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < reach && d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0) claim(best);
  }

  cv.addEventListener("pointerdown", e => { e.preventDefault(); tap(e.clientX, e.clientY); });
  cv.addEventListener("contextmenu", e => e.preventDefault());
  btnReturn.addEventListener("click", returnBag);
  btnSound.addEventListener("click", () => {
    muted = !muted;
    btnSound.textContent = muted ? "✕" : "♫";
    btnSound.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
  });
  // Start on a tap anywhere on the card, through whichever event the host
  // delivers first. Debounced so click-after-touchend can't double-fire.
  let lastStart = 0;
  function start() {
    const now = Date.now();
    if (now - lastStart < 400 || overlay.hidden) return;
    lastStart = now;
    try {
      overlay.hidden = true;
      if (S.phase === "won") startLevel(S.level + 1);
      else if (S.phase === "lost") { S.score = S.levelStartScore; startLevel(S.level); }
      else startLevel(1);
    } catch (err) {
      fail(err);
    }
  }
  overlay.addEventListener("click", start);
  overlay.addEventListener("touchend", e => { e.preventDefault(); start(); });
  btnGo.addEventListener("click", e => { e.stopPropagation(); start(); });

  // ── hud / overlay ───────────────────────────────────────────
  function syncHud() {
    hudLevel.textContent = String(S.level).padStart(2, "0");
    hudScore.textContent = S.score.toLocaleString("en-US");
    const m = MULTS[S.combo];
    hudCombo.textContent = "×" + m;
    hudCombo.classList.toggle("is-hot", m > 1);
    returnCt.textContent = S.returns;
    btnReturn.disabled = S.returns <= 0 || S.tray.length === 0;
  }

  function showOverlay(kind) {
    ovStats.hidden = false;
    ovScore.textContent = S.score.toLocaleString("en-US");
    ovBest.textContent = "×" + S.bestCombo;
    if (kind === "won") {
      ovEyebrow.textContent = "Belt cleared";
      ovTitle.textContent = "ALL CLAIMED";
      ovBlurb.innerHTML = "Belt <em>" + String(S.level + 1).padStart(2, "0") +
        "</em> runs faster and carries more.";
      btnGo.textContent = "Next belt";
    } else {
      ovEyebrow.textContent = "Tray jammed";
      ovTitle.textContent = "NO ROOM";
      ovBlurb.innerHTML = "Seven slots, no match. Leave more bags on the belt — <em>they always come back.</em>";
      btnGo.textContent = "Retry belt " + String(S.level).padStart(2, "0");
    }
    overlay.hidden = false;
  }

  // ── drawing ─────────────────────────────────────────────────
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function trackPath(inset) {
    const { x, y, w, h, r } = track.rect;
    roundRect(x + inset, y + inset, w - inset * 2, h - inset * 2, Math.max(2, r - inset));
  }

  function drawBelt() {
    const band = S.tile * 1.34;

    ctx.lineJoin = "round";
    ctx.strokeStyle = "#151B22";
    ctx.lineWidth = band + 10;
    trackPath(0); ctx.stroke();

    ctx.strokeStyle = "#222B36";
    ctx.lineWidth = band;
    trackPath(0); ctx.stroke();

    ctx.strokeStyle = "#2F3B49";              // rubber slats, scrolling
    ctx.lineWidth = band - 7;
    ctx.setLineDash([3, 14]);
    ctx.lineDashOffset = -S.beltPhase;
    trackPath(0); ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = "#10151B";
    ctx.lineWidth = 2;
    trackPath(band / 2 + 3); ctx.stroke();
  }

  const MOTIF = {
    bandH: (w, h) => ctx.fillRect(-w / 2, -h * 0.13, w, h * 0.26),
    bandV: (w, h) => ctx.fillRect(-w * 0.13, -h / 2, w * 0.26, h),
    cross: (w, h) => {
      ctx.fillRect(-w / 2, -h * 0.11, w, h * 0.22);
      ctx.fillRect(-w * 0.11, -h / 2, w * 0.22, h);
    },
    dots: (w, h) => {
      for (const dx of [-0.24, 0, 0.24]) {
        ctx.beginPath();
        ctx.arc(dx * w, 0, h * 0.11, 0, Math.PI * 2);
        ctx.fill();
      }
    },
    ring: (w, h) => {
      ctx.lineWidth = h * 0.12;
      ctx.strokeStyle = ctx.fillStyle;
      ctx.beginPath();
      ctx.arc(0, 0, h * 0.25, 0, Math.PI * 2);
      ctx.stroke();
    },
    chev: (w, h) => {
      ctx.lineWidth = h * 0.11;
      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineCap = "round";
      for (const dy of [-0.16, 0.12]) {
        ctx.beginPath();
        ctx.moveTo(-w * 0.2, dy * h + h * 0.1);
        ctx.lineTo(0, dy * h - h * 0.08);
        ctx.lineTo(w * 0.2, dy * h + h * 0.1);
        ctx.stroke();
      }
      ctx.lineCap = "butt";
    },
    grid: (w, h) => {
      ctx.fillRect(-w / 2, -h * 0.29, w, h * 0.1);
      ctx.fillRect(-w / 2, h * 0.19, w, h * 0.1);
      ctx.fillRect(-w * 0.29, -h / 2, w * 0.1, h);
      ctx.fillRect(w * 0.19, -h / 2, w * 0.1, h);
    },
    diag: (w, h) => {
      ctx.save();
      ctx.rotate(-0.6);
      for (const dx of [-0.34, 0, 0.34]) ctx.fillRect(dx * w - h * 0.05, -h, h * 0.13, h * 2);
      ctx.restore();
    },
  };

  function drawTile(x, y, type, scale) {
    const t = TYPES[type];
    const w = S.tile * (t.size === 2 ? 1.66 : 1) * scale;
    const h = S.tile * scale;
    const r = Math.min(w, h) * 0.24;

    ctx.save();
    ctx.translate(x, y);

    // handle first, so it sits behind the body
    ctx.strokeStyle = "rgba(8,11,15,.72)";
    ctx.lineWidth = h * 0.1;
    ctx.beginPath();
    ctx.arc(0, -h / 2, w * 0.19, Math.PI * 1.12, Math.PI * 1.88);
    ctx.stroke();

    ctx.shadowColor = "rgba(0,0,0,.55)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = t.c;
    roundRect(-w / 2, -h / 2, w, h, r);
    ctx.fill();
    ctx.shadowColor = "transparent";

    ctx.save();
    roundRect(-w / 2, -h / 2, w, h, r);
    ctx.clip();
    ctx.fillStyle = "rgba(10,14,19,.34)";
    MOTIF[t.m](w, h);
    ctx.restore();

    ctx.fillStyle = "rgba(255,255,255,.14)";   // top light
    roundRect(-w / 2 + 2, -h / 2 + 2, w - 4, h * 0.2, r * 0.6);
    ctx.fill();

    ctx.strokeStyle = "rgba(0,0,0,.32)";
    ctx.lineWidth = 1.5;
    roundRect(-w / 2, -h / 2, w, h, r);
    ctx.stroke();
    ctx.restore();
  }

  // The arrivals board inside the loop: what's still out there, by type.
  // Fills the belt's interior with the one thing a player actually needs
  // to plan — whether a third match is still coming.
  function drawManifest() {
    const counts = new Map();
    for (const b of S.bags) counts.set(b.type, (counts.get(b.type) || 0) + 1);
    if (!counts.size) return;

    const rows = [...counts.entries()].sort((a, b) => a[0] - b[0]);
    const { x, y, w, h } = track.rect;
    const band = S.tile * 1.34;
    if (h - band < 130 || w - band < 120) return;   // no room to read it

    const rowH = Math.min(30, Math.max(20, (h * 0.55) / rows.length));
    const sw = Math.min(26, rowH * 0.92), sh = sw * 0.74;
    const blockH = rows.length * rowH;
    const cx = x + w / 2;
    let ry = y + h / 2 - blockH / 2 + rowH / 2;

    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,178,63,.5)";
    ctx.font = "700 9px " + '"Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.textAlign = "center";
    ctx.letterSpacing = "3px";
    ctx.fillText("ON THE BELT", cx, ry - rowH * 0.95);
    ctx.letterSpacing = "0px";

    for (const [type, n] of rows) {
      const t = TYPES[type];
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = t.c;
      roundRect(cx - sw - 9, ry - sh / 2, sw, sh, 3);
      ctx.fill();
      ctx.save();
      roundRect(cx - sw - 9, ry - sh / 2, sw, sh, 3);
      ctx.clip();
      ctx.translate(cx - sw / 2 - 9, ry);
      ctx.fillStyle = "rgba(10,14,19,.45)";
      MOTIF[t.m](sw, sh);
      ctx.restore();
      ctx.globalAlpha = 1;

      ctx.fillStyle = n <= 2 ? "rgba(255,178,63,.72)" : "rgba(121,131,143,.62)";
      ctx.font = "13px " + "ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.textAlign = "left";
      ctx.fillText(String(n), cx + 2, ry + 0.5);
      ry += rowH;
    }
  }

  function drawWall() {
    const { x, w } = track.rect;
    const band = S.tile * 1.34;
    const left = x - band / 2 - 6, right = x + w + band / 2 + 6;

    ctx.fillStyle = "#0B1015";
    ctx.fillRect(0, 0, W, wall);
    ctx.fillStyle = "#11171E";
    ctx.fillRect(left, 0, right - left, wall);

    // rubber flaps over the two mouths
    ctx.fillStyle = "#1B232C";
    for (const cx of [left, right - band]) {
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(cx + i * (band / 5) + 1, wall - 13, band / 5 - 2, 13);
      }
    }

    ctx.fillStyle = "#0B1015";
    ctx.fillRect(left, wall - 1, right - left, 1);
    ctx.strokeStyle = "#232C36";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(left, wall - 0.5); ctx.lineTo(right, wall - 0.5); ctx.stroke();

    ctx.fillStyle = "#FFB23F";
    ctx.font = "700 10px " + '"Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.letterSpacing = "3px";
    ctx.fillText("BAGGAGE HALL", W / 2, Math.max(12, wall / 2 - 4));
    ctx.letterSpacing = "0px";
  }

  function drawTray() {
    const { x, y, w, h, slotW, gap } = trayBox;

    ctx.fillStyle = "#0C1117";
    roundRect(x - 8, y - 9, w + 16, h + 18, 6);
    ctx.fill();

    ctx.strokeStyle = "#212A34";
    ctx.lineWidth = 1;
    for (let i = 0; i < CAP; i++) {
      roundRect(x + i * (slotW + gap), y, slotW, h, 4);
      ctx.stroke();
    }

    const used = unitsUsed();               // pressure reads before you count
    if (used >= CAP - 2) {
      ctx.strokeStyle = used >= CAP - 1 ? "rgba(255,107,94,.85)" : "rgba(255,178,63,.55)";
      ctx.lineWidth = 2;
      roundRect(x - 8, y - 9, w + 16, h + 18, 6);
      ctx.stroke();
    }

    const scale = Math.min(1, (h - 12) / S.tile);
    for (let i = 0; i < S.tray.length; i++) {
      const it = S.tray[i];
      const c = slotCenter(i);
      if (it.fly) {
        const k = 1 - Math.pow(1 - it.fly.t, 3);
        const mx = (it.fly.x + c.x) / 2, my = Math.min(it.fly.y, c.y) - 50;
        const px = (1 - k) * (1 - k) * it.fly.x + 2 * (1 - k) * k * mx + k * k * c.x;
        const py = (1 - k) * (1 - k) * it.fly.y + 2 * (1 - k) * k * my + k * k * c.y;
        drawTile(px, py, it.type, 1 - (1 - scale) * k);
      } else {
        drawTile(c.x, c.y, it.type, scale);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (S.shake > 0) {
      ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    }

    drawBelt();
    drawManifest();
    for (const b of S.bags) {
      const p = pointAt(b.s);
      drawTile(p.x, p.y, b.type, 1);
    }
    drawWall();                              // occludes the top of the loop

    for (const p of S.particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;

    drawTray();
    ctx.restore();
  }

  // ── loop ────────────────────────────────────────────────────
  let last = 0;
  function frame(ts) {
    try { step(ts); } catch (err) { fail(err); return; }   // never die silently
    requestAnimationFrame(frame);
  }

  function step(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0);
    last = ts;

    const speed = S.phase === "playing" ? S.speed : 38;
    S.beltPhase = (S.beltPhase + speed * dt) % track.total;
    for (const b of S.bags) b.s = (b.s + speed * dt) % track.total;

    if (S.phase === "playing") {
      if (S.comboTimer > 0) {
        S.comboTimer -= dt;
        if (S.comboTimer <= 0 && S.combo > 0) { S.combo = 0; syncHud(); }
      }
      let landed = false;
      for (const it of S.tray) {
        if (!it.fly) continue;
        it.fly.t += dt / FLY_TIME;
        if (it.fly.t >= 1) { it.fly = null; landed = true; }
      }
      if (landed && !anyFlying()) { resolve(); checkEnd(); }
    }

    for (let i = S.particles.length - 1; i >= 0; i--) {
      const p = S.particles[i];
      p.age += dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 520 * dt;
      if (p.age >= p.life) S.particles.splice(i, 1);
    }
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 22);

    draw();
  }

  // ── boot ────────────────────────────────────────────────────
  function resize() {
    const r = cv.getBoundingClientRect();
    // Embedded hosts can measure zero before their first layout pass. Fall back
    // to a sane board rather than leaving the game without a track to run on.
    const prev = track ? track.total : 0;
    W = Math.max(240, r.width || cv.clientWidth || 360);
    H = Math.max(320, r.height || cv.clientHeight || 560);
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
    if (prev && track.total !== prev) {          // keep the belt's spacing
      const k = track.total / prev;
      for (const b of S.bags) b.s = (b.s * k) % track.total;
      S.beltPhase = (S.beltPhase * k) % track.total;
    }
  }

  // A dead Start button tells you nothing. If boot fails, say so on the card.
  function fail(err) {
    ovEyebrow.textContent = "Prototype error";
    ovTitle.textContent = "SNAG";
    ovBlurb.textContent = String((err && err.message) || err);
    ovStats.hidden = true;
    btnGo.textContent = "Reload";
    btnGo.onclick = () => location.reload();
    overlay.hidden = false;
  }

  try {
    new ResizeObserver(resize).observe(cv);
    addEventListener("resize", resize);
    resize();
    requestAnimationFrame(resize);               // re-measure after first paint

    // A belt idles behind the title card. If it is moving, the game is alive.
    S.bags = Array.from({ length: 14 }, (_, i) => ({
      type: SMALL[i % 5],
      s: (i * track.total) / 14,
    }));
    sizeTiles();
    syncHud();
    requestAnimationFrame(frame);
  } catch (err) {
    fail(err);
  }
})();
</script>
